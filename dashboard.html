<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Catatan Bank Sampah</title>

  <!-- A. Init tema sebelum paint -->
  <script>
    (function () {
      var t = localStorage.getItem('sw_theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>

  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <nav id="navbar"></nav>
  <main class="container">
    <div class="page-header">
      <div>
        <h1 id="pageTitle">Dashboard</h1>
        <p class="sub" id="pageSub"></p>
      </div>
    </div>
    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-label">Total bulan ini</div>
        <div class="stat-value" id="statTotal">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Rata-rata / hari</div>
        <div class="stat-value" id="statAvg">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Hari tercatat</div>
        <div class="stat-value" id="statDays">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total entri</div>
        <div class="stat-value" id="statEntries">—</div>
      </div>
    </div>
    <div class="card">
      <h2 class="card-title">Berat Sampah Harian (kg)</h2>
      <div class="chart-box"><canvas id="chart"></canvas></div>
    </div>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/dashboard.js"></script>

  <!-- B. Toggle tema -->
  <button class="theme-toggle" id="themeToggle" aria-label="Ganti tema">🌙</button>
  <script>
    (function () {
      var btn = document.getElementById('themeToggle');
      function sync() {
        var cur = document.documentElement.getAttribute('data-theme') || 'light';
        btn.textContent = cur === 'dark' ? '☀️' : '🌙';
        btn.title = cur === 'dark' ? 'Mode Terang' : 'Mode Gelap';
      }
      sync();
      btn.addEventListener('click', function () {
        var cur = document.documentElement.getAttribute('data-theme') || 'light';
        var next = cur === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('sw_theme', next);
        sync();
      });
    })();
  </script>
</body>
</html>
