<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk — Catatan Bank Sampah</title>

  <!-- A. Init tema sebelum paint -->
  <script>
    (function () {
      var t = localStorage.getItem('sw_theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrap">
    <h1>♻️ Masuk</h1>
       <form id="loginForm" autocomplete="off">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" autocomplete="off" required autofocus>
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="password-wrap">
          <input type="password" id="password" autocomplete="new-password" required>
          <button type="button" class="pw-toggle" aria-label="Tampilkan sandi">
            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </div>
      <p class="msg-err" id="err" style="display:none"></p>
      <button type="submit" class="btn-primary">Masuk</button>
    </form>
    <p style="text-align:center; font-size:13px; color:var(--text-muted); margin-top:16px;">
      Belum punya akun?
      <a href="register.html" style="color:var(--emerald-dark); font-weight:600;">Daftar</a>
    </p>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script>
    if (getCurrentUser()) window.location.href = 'dashboard.html';
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const err = document.getElementById('err');
      const user = loginUser(email, password);
      if (!user) {
        err.textContent = 'Email atau password salah.';
        err.style.display = 'block';
        return;
      }
      window.location.href = 'dashboard.html';
    });
  </script>

  <!-- B. Toggle tema -->
  <button class="theme-toggle" id="themeToggle" aria-label="Ganti tema">🌙</button>
  <script>
    (function () {
      var btn = document.getElementById('themeToggle');
      function sync() {
        var cur = document.documentElement.getAttribute('data-theme') || 'light';
        btn.textContent = cur === 'dark' ? '☀️' : '🌙';
        btn.title = cur === 'dark' ? 'Mode Terang' : 'Mode Gelap';
      }
      sync();
      btn.addEventListener('click', function () {
        var cur = document.documentElement.getAttribute('data-theme') || 'light';
        var next = cur === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('sw_theme', next);
        sync();
      });
    })();
  </script>
</body>
</html>
