<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk — Sekolah Sampah</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrap">
    <h1>🗑️ Masuk</h1>
    <form id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" required autofocus>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required>
      </div>
      <p class="msg-err" id="err" style="display:none"></p>
      <button type="submit" class="btn-primary">Masuk</button>
    </form>
    <p style="text-align:center; font-size:13px; color:#6b7280; margin-top:16px;">
      Belum punya akun?
      <a href="register.html" style="color:#059669;">Daftar</a>
    </p>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Kalau sudah login, langsung ke dashboard
    if (getCurrentUser()) window.location.href = 'dashboard.html';

    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const err = document.getElementById('err');

      const user = loginUser(email, password);
      if (!user) {
        err.textContent = 'Email atau password salah.';
        err.style.display = 'block';
        return;
      }
      window.location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
