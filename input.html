<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catat Sampah — Sekolah Sampah</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav id="navbar"></nav>
  <main class="container">
    <div style="max-width: 440px; margin: 0 auto;">
      <h1 style="font-size:22px; margin-bottom:16px;">Catat Sampah</h1>
      <div class="card">
        <form id="inputForm">
          <div class="form-group">
            <label>Tanggal</label>
            <input type="date" id="date" required>
          </div>
          <div class="form-group">
            <label>Kategori</label>
            <select id="category"></select>
          </div>
          <div class="form-group">
            <label>Berat (kg)</label>
            <input type="number" id="weight" step="0.01" min="0.01" required>
          </div>
          <div class="form-group">
            <label>Catatan (opsional)</label>
            <textarea id="note" rows="2"></textarea>
          </div>
          <p class="msg-ok" id="okMsg" style="display:none"></p>
          <p class="msg-err" id="errMsg" style="display:none"></p>
          <button type="submit" class="btn-primary">Simpan</button>
        </form>
      </div>
      <p style="text-align:center; margin-top:16px;">
        <a href="dashboard.html" style="font-size:13px; color:#6b7280;">← Kembali ke dashboard</a>
      </p>
    </div>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/input.js"></script>
</body>
</html>
