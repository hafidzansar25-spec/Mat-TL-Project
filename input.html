<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catat Sampah — Catatan Bank Sampah</title>

  <!-- A. Init tema sebelum paint -->
  <script>
    (function () {
      var t = localStorage.getItem('sw_theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav id="navbar"></nav>
  <main class="container">
    <div style="max-width: 480px; margin: 0 auto;">
      <div class="page-header">
        <div>
          <h1>Catat Sampah</h1>
          <p class="sub">Tambahkan catatan sampah harianmu</p>
        </div>
      </div>
      <div class="card">
        <form id="inputForm">
          <div class="form-group">
            <label>Tanggal</label>
            <input type="date" id="date" required>
          </div>
          <div class="form-group">
            <label>Kategori</label>
            <select id="category"></select>
          </div>
          <div class="form-group">
            <label>Berat (kg)</label>
            <input type="number" id="weight" step="0.01" min="0.01" required>
          </div>
          <div class="form-group">
            <label>Catatan (opsional)</label>
            <textarea id="note" rows="2"></textarea>
          </div>
          <p class="msg-ok" id="okMsg" style="display:none"></p>
          <p class="msg-err" id="errMsg" style="display:none"></p>
          <button type="submit" class="btn-primary">Simpan</button>
        </form>
      </div>
      <p style="text-align:center; margin-top:18px;">
        <a href="dashboard.html" style="font-size:13px; color:var(--text-muted);">← Kembali ke dashboard</a>
      </p>
    </div>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/input.js"></script>

  <!-- B. Toggle tema -->
  <button class="theme-toggle" id="themeToggle" aria-label="Ganti tema">🌙</button>
  <script>
    (function () {
      var btn = document.getElementById('themeToggle');
      function sync() {
        var cur = document.documentElement.getAttribute('data-theme') || 'light';
        btn.textContent = cur === 'dark' ? '☀️' : '🌙';
        btn.title = cur === 'dark' ? 'Mode Terang' : 'Mode Gelap';
      }
      sync();
      btn.addEventListener('click', function () {
        var cur = document.documentElement.getAttribute('data-theme') || 'light';
        var next = cur === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('sw_theme', next);
        sync();
      });
    })();
  </script>
</body>
</html>
