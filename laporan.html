<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laporan — Catatan Bank Sampah</title>

  <!-- A. Init tema sebelum paint -->
  <script>
    (function () {
      var t = localStorage.getItem('sw_theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav id="navbar"></nav>
  <main class="container">
    <div class="page-header">
      <div>
        <h1>Laporan Bulanan</h1>
        <p class="sub" id="summary"></p>
      </div>
      <div style="display:flex; gap:8px; align-items:center;">
        <input type="month" id="monthFilter" class="btn-secondary">
        <button class="btn-primary" style="width:auto;" id="btnExport">Export CSV</button>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Tanggal</th>
            <th>Kategori</th>
            <th style="text-align:right;">Berat</th>
            <th>Catatan</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/laporan.js"></script>

  <!-- B. Toggle tema -->
  <button class="theme-toggle" id="themeToggle" aria-label="Ganti tema">🌙</button>
  <script>
    (function () {
      var btn = document.getElementById('themeToggle');
      function sync() {
        var cur = document.documentElement.getAttribute('data-theme') || 'light';
        btn.textContent = cur === 'dark' ? '☀️' : '🌙';
        btn.title = cur === 'dark' ? 'Mode Terang' : 'Mode Gelap';
      }
      sync();
      btn.addEventListener('click', function () {
        var cur = document.documentElement.getAttribute('data-theme') || 'light';
        var next = cur === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('sw_theme', next);
        sync();
      });
    })();
  </script>
</body>
</html>
