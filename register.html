<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar — Catatan Bank Sampah</title>

  <!-- A. Init tema sebelum paint -->
  <script>
    (function () {
      var t = localStorage.getItem('sw_theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrap">
    <h1>♻️ Daftar Akun</h1>
    <form id="registerForm">
      <div class="form-group">
        <label>Nama Lengkap</label>
        <input type="text" id="name" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="form-group">
        <label>Password (min 4 karakter)</label>
        <input type="password" id="password" minlength="4" required>
      </div>
      <div class="form-group">
        <label>Peran</label>
        <select id="role">
          <option value="siswa">Siswa</option>
          <option value="guru">Guru</option>
          <option value="staf">Staf</option>
        </select>
      </div>
      <div class="form-group" id="kelasGroup">
        <label>Kelas (untuk siswa)</label>
        <input type="text" id="kelas" placeholder="cth: XI IPA 2">
      </div>
      <p class="msg-err" id="err" style="display:none"></p>
      <button type="submit" class="btn-primary">Daftar</button>
    </form>
    <p style="text-align:center; font-size:13px; color:var(--text-muted); margin-top:16px;">
      Sudah punya akun?
      <a href="index.html" style="color:var(--emerald-dark); font-weight:600;">Masuk</a>
    </p>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script>
    if (getCurrentUser()) window.location.href = 'dashboard.html';
    const roleSelect = document.getElementById('role');
    const kelasGroup = document.getElementById('kelasGroup');
    roleSelect.addEventListener('change', () => {
      kelasGroup.style.display = roleSelect.value === 'siswa' ? 'block' : 'none';
    });
    document.getElementById('registerForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const err = document.getElementById('err');
      err.style.display = 'none';
      const payload = {
        name: document.getElementById('name').value.trim(),
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
        role: roleSelect.value,
        kelas: roleSelect.value === 'siswa' ? document.getElementById('kelas').value.trim() : '',
      };
      try {
        const user = createUser(payload);
        setSession(user.id);
        window.location.href = 'dashboard.html';
      } catch (ex) {
        err.textContent = ex.message;
        err.style.display = 'block';
      }
    });
  </script>

  <!-- B. Toggle tema -->
  <button class="theme-toggle" id="themeToggle" aria-label="Ganti tema">🌙</button>
  <script>
    (function () {
      var btn = document.getElementById('themeToggle');
      function sync() {
        var cur = document.documentElement.getAttribute('data-theme') || 'light';
        btn.textContent = cur === 'dark' ? '☀️' : '🌙';
        btn.title = cur === 'dark' ? 'Mode Terang' : 'Mode Gelap';
      }
      sync();
      btn.addEventListener('click', function () {
        var cur = document.documentElement.getAttribute('data-theme') || 'light';
        var next = cur === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('sw_theme', next);
        sync();
      });
    })();
  </script>
</body>
</html>
